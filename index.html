<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test | Delivery Cost Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Header -->

    <div class="header-card">

        <div class="header-content">

            <div>
                <h1>Delivery Cost Calculator</h1>
                <p>Test</p>
            </div>

        </div>

    </div>

    <!-- Input Section -->

    <div class="card">

        <h2>Trip Information</h2>

        <div class="origin-card">

            <div class="origin-label">
                Starting Location
            </div>

            <div class="origin-value">
                📍 16 Furby Street
            </div>

            <div class="origin-city">
                Winnipeg, Manitoba R2B 1Q9
            </div>

        </div>

        <label class="section-label">
            Delivery Address
        </label>

        <input
            id="destination"
            type="text"
            placeholder="Start typing a destination address">

        <div id="suggestions"></div>

        <label class="section-label">
            Delivery Crew
        </label>

        <div class="crew-toggle">

            <input
                type="radio"
                id="crew1"
                name="crewSize"
                value="1"
                checked>

            <label for="crew1">
                👤 1 Person
            </label>

            <input
                type="radio"
                id="crew2"
                name="crewSize"
                value="2">

            <label for="crew2">
                👥 2 People
            </label>

        </div>

        <button id="calculateBtn">
            Calculate Delivery Charge
        </button>

    </div>

    <!-- Results -->

    <div id="results"></div>

</div>

<script src="app.js"></script>

</body>
</html>
