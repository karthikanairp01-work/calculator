name: Update Fuel Price

on:

  schedule:
    - cron: '0 12 * * *'

  workflow_dispatch:

jobs:

  update-fuel-price:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Diesel Price

        env:
          CARDOG_API_KEY: ${{ secrets.CARDOG_API_KEY }}

        run: |

          RESPONSE=$(curl -s \
          -H "x-api-key: $CARDOG_API_KEY" \
          "https://api.cardog.app/v2/fuel/prices?area=CA-MB&fuel=diesel")

          PRICE=$(echo "$RESPONSE" | jq '.latest.medianCentsPerLitre / 100')

          TODAY=$(date +%F)

          cat > fuel-config.json << EOF
          {
            "dieselPrice": $PRICE,
            "updated": "$TODAY"
          }
          EOF

      - name: Commit Updated File

        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add fuel-config.json

          git diff --staged --quiet || \
          git commit -m "Update fuel price"

          git push